name: Sync Tivoli Routes

on:
  pull_request:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tivoli-routes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Tivoli route sync
        shell: bash
        run: |
          set -o pipefail
          node scripts/sync-tivoli-routes.mjs | tee sync-output.log

      - name: Show git status
        run: git status --short

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Tivoli route sync"
            echo
            echo '```text'
            cat sync-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
